<!DOCTYPE html>
<html>

<head>
    <title>DIGITAL NOTEBOOK</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

  
    <div id="headPanel">
        <h1>DIGITAL NOTEBOOK</h1>
    </div> 


    <nav id="subjects">
        <button id="subject1" data-index="0">SUBJECT 1</button>
        <button id="subject2" data-index="1">SUBJECT 2</button>
        <button id="subject3" data-index="2">SUBJECT 3</button>
        <button id="subject4" data-index="3">SUBJECT 4</button>
        <button id="subject5" data-index="4">SUBJECT 5</button>
        <button id="addSubject">+ ADD SUBJECT</button>
    </nav>


    <nav id="notesArea">
        <main>
            <textarea id="leftTextArea" rows="30" cols="70"></textarea>
            <textarea id="rightTextArea" rows="30" cols="70"></textarea>
        </main>
    </nav>

 
    <script src="script.js"></script>
</body>

</html>
